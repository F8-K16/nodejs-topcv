name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to VPS
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pull, build, and restart on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::${name} is empty. Add it under Settings, Secrets and variables, Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          case "$VPS_SSH_KEY" in
            *"PRIVATE KEY"*) ;;
            *)
              echo "::error title=Bad SSH key::VPS_SSH_KEY must be the private key (github-actions-deploy), not the .pub file."
              exit 1
              ;;
          esac

          key_lines="$(printf '%s\n' "$VPS_SSH_KEY" | wc -l)"
          if [ "$key_lines" -lt 3 ]; then
            echo "::error title=Bad SSH key::VPS_SSH_KEY is a single line. Paste the full private key and keep its line breaks."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          escape() {
            printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\\\''/g")"
          }

          port="${VPS_SSH_PORT:-22}"
          echo "Connecting to ${VPS_USER}@${VPS_HOST}:${port}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$port" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}" \
            "DEPLOY_SHA=$(escape "$DEPLOY_SHA") /bin/bash $(escape "$VPS_APP_DIR/scripts/deploy.sh")"
